services:

  # ============================================================
  # PostgreSQL Database
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: awf_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_workflow

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d ai_workflow"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - awf-network


  # ============================================================
  # Ollama LLM Service
  # ============================================================
  ollama:
    image: ollama/ollama:latest
    container_name: awf_ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    environment:
      OLLAMA_HOST: "0.0.0.0:11434"

    networks:
      - awf-network


  # ============================================================
  # FastAPI Backend
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: awf_backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

      ollama:
        condition: service_started

    ports:
      - "8000:8000"

    environment:

      # ----------------------------
      # Application
      # ----------------------------
      ENV: production
      DEBUG: "false"

      API_HOST: "0.0.0.0"
      API_PORT: "8000"

      # ----------------------------
      # PostgreSQL
      # ----------------------------
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/ai_workflow"

      # ----------------------------
      # Ollama
      # ----------------------------
      OLLAMA_BASE_URL: "http://ollama:11434"

      # ----------------------------
      # CORS
      # ----------------------------
      ALLOWED_ORIGINS: "http://localhost:3000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - awf-network


  # ============================================================
  # React + Vite + Nginx Frontend
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: awf_frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "3000:80"

    environment:
      NODE_ENV: production
      VITE_APP_NAME: "AI Workflow Framework"

    networks:
      - awf-network


# ============================================================
# Networks
# ============================================================
networks:
  awf-network:
    driver: bridge


# ============================================================
# Persistent Volumes
# ============================================================
volumes:
  pgdata:
    driver: local

  ollama_data:
    driver: local